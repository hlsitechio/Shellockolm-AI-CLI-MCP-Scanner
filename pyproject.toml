[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellockolm"
version = "3.1.0"
description = "CLI & MCP Security Scanner for AI Agents - Detects CVEs, malware & supply chain attacks in React/Next.js/npm projects. Integrates with Claude, Copilot, Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = [
    "security-scanner", "ai-agent", "mcp-server", "cli-tool",
    "vulnerability-scanner", "cve-detection", "malware-scanner",
    "react", "nextjs", "nodejs", "npm", "rce",
    "claude-mcp", "copilot", "gemini", "ai-assistant",
    "supply-chain-security", "devsecops", "cybersecurity",
    "react-server-components", "shellockolm", "sherlock-holmes"
]
authors = [
    {name = "HLS iTech", email = "hlarosesurprenant@gmail.com"}
]
maintainers = [
    {name = "HLS iTech", email = "hlarosesurprenant@gmail.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
]

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "packaging>=23.0",
    "aiofiles>=23.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    # Used by the workflow/contract tests (test_github_action.py,
    # test_pre_commit_hooks.py) to parse the shipped action.yml /
    # .pre-commit-hooks.yaml. Required for the suite to collect under a clean
    # `pip install .[dev]`.
    "pyyaml>=6.0",
    # Property-based redaction tests (tests/test_redaction_properties.py) that
    # assert secrets are never echoed unredacted in finding output across the
    # full generated space of every credential shape. The module skips if absent,
    # but it must be installed for the dev suite to actually run the properties.
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/hlsitechio/Shellockolm-AI-CLI-MCP-Scanner"
Documentation = "https://github.com/hlsitechio/Shellockolm-AI-CLI-MCP-Scanner/blob/main/README.md"
Repository = "https://github.com/hlsitechio/Shellockolm-AI-CLI-MCP-Scanner"
"Bug Tracker" = "https://github.com/hlsitechio/Shellockolm-AI-CLI-MCP-Scanner/issues"
Changelog = "https://github.com/hlsitechio/Shellockolm-AI-CLI-MCP-Scanner/blob/main/CHANGELOG.md"

[project.scripts]
shellockolm = "cli:main"
shellockolm-scan = "cli:main"
shellockolm-mcp = "mcp_server:run"
# Legacy commands (deprecated, kept for backwards compatibility)
shellockolm-fix = "auto_fix:main"
shellockolm-patch = "mass_patcher:main"
shellockolm-malware = "malware_scanner:main"
shellockolm-github = "github_scanner:main"

# ---------------------------------------------------------------------------
# Packaging: FLAT install from src/.
#
# The source uses flat imports (e.g. `import compat`, `from scanners import ...`,
# `from vulnerability_database import ...`) with NO `shellockolm.` namespace and
# NO sys.path manipulation. We therefore install every loose module in src/ as a
# top-level importable name (py-modules) and let packages.find pick up the
# `scanners` subpackage (which has an __init__.py). The console-script entry
# points (cli:main, mcp_server:run, etc.) resolve against these flat names.
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "cli",
    "compat",
    "scanner",
    "server",
    "vulnerability_database",
    "scan",
    "scan_simple",
    "auto_fix",
    "mass_patcher",
    "malware_analyzer",
    "malware_scanner",
    "secrets_scanner",
    "security_score",
    "remediation",
    "github_actions",
    "github_advisory",
    "github_scanner",
    "ignore_handler",
    "watch_mode",
    "progress_tracker",
    "context_intelligence",
    "sarif_output",
    "sbom_generator",
    "configure_mcp",
    "dependency_tree",
    "lockfile_analyzer",
    "npm_audit",
    "mcp_server",
    "gui",
    # Pure CLI-helper modules imported by `cli` (must be installed or the
    # `shellockolm` console script fails to import on a pip install).
    "diff_scan",
    "baseline",
    "doctor",
    "config_file",
    "mcp_config_locations",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# Ruff lint gate (build-loop task #42).
#
# Single source of truth for the lint config, shared by CI and a local
# `ruff check src`. The CI `lint` job runs this as a BUILD-BLOCKING gate (no
# continue-on-error), so a regression in the enforced rule families fails the
# build — the same "real gate" philosophy as the coverage floor (task #41).
#
# We enable the high-signal correctness families (pyflakes `F`, pycodestyle
# `E`/`W`). The genuine-bug codes — undefined names (F821/F823), redefinitions
# (F811), syntax errors (E9), format/comparison bugs — are NOT ignored and must
# stay clean (the four F821/F823 crashes this gate first surfaced are now
# fixed). A pre-existing *cosmetic* backlog (line length, trailing/blank
# whitespace, placeholder-less f-strings, unused imports/vars, the CLI's
# intentional deferred imports, a handful of bare excepts) is explicitly
# deferred via `ignore` below and is ratcheted DOWN over time — never up.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-too-long — pre-existing width backlog (formatter owns width)
    "W291",  # trailing-whitespace — whitespace backlog
    "W293",  # blank-line-with-whitespace — whitespace backlog
    "E402",  # module-import-not-at-top — intentional deferred imports in the CLI
    "F401",  # unused-import — import-hygiene backlog
    "F541",  # f-string-missing-placeholders — cosmetic backlog
    "F841",  # unused-variable — backlog
    "E722",  # bare-except — broad-catch audit tracked separately
    "E712",  # true-false-comparison — cosmetic backlog
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Coverage is intentionally NOT in default addopts so the suite runs without
# pytest-cov installed. Run the coverage gate explicitly with:
#     pytest tests/ --cov=src --cov-report=term-missing
# The fail-under threshold lives in [tool.coverage.report] below, so it is
# enforced identically whether run locally or in CI (no duplicated number).
addopts = "-v"

# ---------------------------------------------------------------------------
# Coverage gate (build-loop task #41).
#
# A non-regression floor on line coverage over src/. Current measured coverage
# is ~30% across 831 tests (the legacy CLI/GUI/scanner-shim modules are largely
# untested and dominate the denominator; the agent detection engine and the
# CLI-helper modules it ships sit at 93-100%). The CI floor is set just under
# the measured value to absorb platform/interpreter variance (a few tests are
# Windows-only and skip on the Linux coverage job) and is ratcheted UP as real
# coverage grows — never down. pytest-cov reads `fail_under` from this config,
# so the threshold is defined in exactly one place.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = false
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 28
precision = 2
show_missing = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Static type checking (mypy). Like the ruff/coverage gates, this is a ratchet:
# the checked surface starts at the detection-critical core — the modular
# scanners (`src/scanners`, where the agent supply-chain rules live) and the
# server-authoritative licensing client (`src/licensing.py`) — and is widened
# over time, never narrowed. `mypy_path = "src"` resolves the project's flat
# imports (e.g. `from vulnerability_database import ...`) from the repo root, and
# `follow_imports = "silent"` type-checks dependencies for accuracy while keeping
# the gate scoped to the target files (out-of-scope modules pulled in via imports
# are not reported). The CI `typecheck` job runs `mypy` build-blocking; a local
# bare `mypy` checks the same `files` set with no arguments.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/scanners", "src/licensing.py"]
follow_imports = "silent"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
